plugins {
    id "com.android.application"
}

android {
    namespace "com.focusflow.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.focusflow.app"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "1.4.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedWebAssets = layout.buildDirectory.dir("generated/focusflowAssets")

tasks.register("syncWebAssets", Copy) {
    from(rootProject.file("..")) {
        include "index.html"
        include "config.js"
        include "styles.css"
        include "app.js"
        include "icon.svg"
        include "manifest.webmanifest"
    }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)
tasks.named("preBuild").configure { dependsOn("syncWebAssets") }
