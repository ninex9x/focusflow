name: Relatar um problema
description: Informe um comportamento incorreto ou inesperado.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o FocusFlow. Não publique dados pessoais ou segredos.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options: [Web/PWA, Windows, Linux, Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: Exemplo: 1.4.4
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Use somente dados fictícios em logs ou capturas.
