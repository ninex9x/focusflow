name: Build clients

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build Android APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: FocusFlow-Android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: desktop:windows
            artifact: FocusFlow-Windows
            files: app/release/*.exe
          - os: ubuntu-latest
            command: desktop:linux
            artifact: FocusFlow-Linux
            files: |
              app/release/*.AppImage
              app/release/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run desktop:icon
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
